<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TSUBAME DONUT クーポン</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --navy: #1f2f57;
    --sun: #f6b93b;
    --bg: #f4f6fa;
    --card: #ffffff;
    --fg: #1b2333;
    --muted: #677085;
    --line: #dfe3eb;
    --ok: #1f9d6a;
    --bad: #c2453d;
    --disabled: #b8bfcc;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    font-size: 15px; line-height: 1.6;
    padding: 20px 16px calc(28px + env(safe-area-inset-bottom, 0px));
    max-width: 480px; margin: 0 auto;
  }
  .brand { font-weight: 800; letter-spacing: .12em; color: var(--navy); font-size: 13px; }
  .hello { color: var(--muted); font-size: 13px; margin: 2px 0 14px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .band { background: var(--navy); color: #fff; padding: 12px 16px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
  .band .code { font-family: ui-monospace, Menlo, monospace; font-size: 11px; opacity: .8; font-weight: 400; }
  .card.used .band { background: var(--ok); }
  .card.expired .band, .card.not_yet .band { background: var(--disabled); }
  .body { padding: 18px 16px; display: grid; gap: 12px; }
  .benefit { font-size: 22px; font-weight: 800; line-height: 1.4; }
  .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-top: 1px dashed var(--line); padding-top: 12px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .pill { border-radius: 99px; padding: 2px 10px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .pill.available { background: #e3f4ec; color: var(--ok); }
  .pill.soon { background: #fdf0d3; color: #8a5a00; }
  .pill.used { background: #e3f4ec; color: var(--ok); }
  .pill.expired, .pill.not_yet { background: #f6e1df; color: var(--bad); }

  .usedbox { text-align: center; padding: 8px 0 4px; }
  .usedbox .big { font-size: 30px; font-weight: 900; color: var(--ok); letter-spacing: .1em; }
  .usedbox .at { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .clock { text-align: center; color: var(--muted); font-size: 12px; margin: 12px 0 0; font-variant-numeric: tabular-nums; }
  .clock b { color: var(--fg); font-size: 15px; }

  .actions { margin-top: 18px; display: grid; gap: 8px; }
  .btn { font: inherit; font-weight: 800; font-size: 17px; letter-spacing: .08em; border: 0; border-radius: 14px; padding: 16px; background: var(--sun); color: #1b2333; cursor: pointer; }
  .btn:disabled { background: var(--disabled); color: #fff; cursor: not-allowed; }
  .btn:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }
  .note { text-align: center; color: var(--muted); font-size: 12px; margin: 0; }
  .next { margin-top: 14px; background: #e7f1fb; border-radius: 12px; padding: 12px; font-size: 13px; }

  .center { text-align: center; padding: 60px 0; color: var(--muted); }
  .error { background: #f6e1df; color: var(--bad); border-radius: 12px; padding: 14px; font-size: 14px; }

  .overlay { position: fixed; inset: 0; background: rgba(10, 14, 25, .5); display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--card); width: 100%; max-width: 480px; border-radius: 20px 20px 0 0; padding: 22px 18px calc(24px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; }
  .sheet h2 { margin: 0; font-size: 17px; }
  .sheet p { margin: 0; color: var(--muted); font-size: 14px; }
  .row2 { display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--fg); }
  .btn.go { background: var(--navy); color: #fff; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="brand">TSUBAME DONUT</div>
  <div class="hello" id="hello"></div>

  <div id="loading" class="center">読み込み中…</div>
  <div id="error" class="error" hidden></div>

  <main id="main" hidden>
    <div class="card" id="card">
      <div class="band"><span id="cName"></span><span class="code" id="cCode"></span></div>
      <div class="body">
        <div class="benefit" id="cBenefit"></div>
        <div class="usedbox" id="usedBox" hidden>
          <div class="big">使用済み</div>
          <div class="at" id="usedAt"></div>
        </div>
        <div class="meta">
          <span id="cExpiry"></span>
          <span class="pill" id="cPill"></span>
        </div>
      </div>
    </div>

    <p class="clock">現在時刻 <b id="clock"></b></p>

    <div class="next" id="next" hidden></div>

    <div class="actions" id="actions">
      <button class="btn" id="useBtn" type="button">使用する</button>
      <p class="note" id="useNote">お会計時にこの画面をスタッフに見せてください。<br>ボタンはスタッフが押します。</p>
    </div>
  </main>

  <div class="overlay" id="confirm" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <h2 id="confirmTitle">スタッフ確認</h2>
      <p id="confirmText"></p>
      <div class="row2">
        <button class="btn ghost" id="cancelBtn" type="button">戻る</button>
        <button class="btn go" id="okBtn" type="button">使用済みにする</button>
      </div>
    </div>
  </div>

<script>
  // ===== ここを自分の値に書き換える =====
  const LIFF_ID = '2011940731-AAMbJVeu';                  // テスト用 tsubame_coupon
  const GAS_URL = 'https://script.google.com/macros/s/XXXXXXXX/exec'; // GAS ウェブアプリURL
  // ======================================

  const $ = (id) => document.getElementById(id);
  let coupon = '';
  let idToken = '';
  let current = null;

  const pad = (n) => String(n).padStart(2, '0');
  const fmtDate = (d) => `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())}`;
  const fmtDateTime = (d) => `${fmtDate(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;

  // スクリーンショットの使い回し対策：秒まで動く時計を表示
  function tick() {
    const d = new Date();
    $('clock').textContent = `${fmtDate(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }
  setInterval(tick, 1000); tick();

  function showError(msg) {
    $('loading').hidden = true;
    $('main').hidden = true;
    $('error').hidden = false;
    $('error').textContent = msg;
  }

  // GAS へ送信（text/plain にすることで CORS のプリフライトを回避）
  async function callGas(payload) {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  function render(data) {
    current = data;
    $('loading').hidden = true;
    $('error').hidden = true;
    $('main').hidden = false;

    if (data.displayName) $('hello').textContent = `${data.displayName} さん`;
    const c = data.coupon;
    $('cName').textContent = c.name;
    $('cCode').textContent = c.param;
    $('cBenefit').textContent = c.benefit;

    const card = $('card');
    card.className = 'card ' + data.state;
    const pill = $('cPill');
    const btn = $('useBtn');

    // 有効期限
    if (data.expiresAt) {
      const exp = new Date(data.expiresAt);
      $('cExpiry').textContent = `有効期限 ${fmtDate(exp)} まで`;
    } else {
      $('cExpiry').textContent = '有効期限 なし';
    }

    $('usedBox').hidden = data.state !== 'used';
    $('next').hidden = true;

    if (data.state === 'available') {
      let label = '利用できます';
      pill.className = 'pill available';
      if (data.expiresAt) {
        const days = Math.ceil((new Date(data.expiresAt) - new Date()) / 86400000) - 1;
        label = days <= 0 ? '本日まで' : `あと${days}日`;
        if (days <= 3) pill.className = 'pill soon';
      }
      pill.textContent = label;
      btn.disabled = false;
      btn.textContent = '使用する';
      $('useNote').hidden = false;
    } else if (data.state === 'used') {
      pill.className = 'pill used';
      pill.textContent = '使用済み';
      $('usedAt').textContent = `${fmtDateTime(new Date(data.usedAt))} に使用`;
      btn.disabled = true;
      btn.textContent = '使用済み';
      $('useNote').hidden = true;
      if (data.next) {
        $('next').hidden = false;
        $('next').textContent = `ご来店ありがとうございます。次回の「${data.next.name}」は ${data.next.date} にLINEでお届けします。`;
      }
    } else if (data.state === 'expired') {
      pill.className = 'pill expired';
      pill.textContent = '期限切れ';
      btn.disabled = true;
      btn.textContent = '有効期限が切れています';
      $('useNote').hidden = true;
    } else {
      pill.className = 'pill not_yet';
      pill.textContent = 'まだ使えません';
      btn.disabled = true;
      btn.textContent = data.message || 'このクーポンはまだ使えません';
      $('useNote').hidden = true;
    }
  }

  async function load() {
    try {
      const data = await callGas({ action: 'status', coupon, idToken });
      if (!data.ok && !data.state) return showError(data.message || 'クーポンを読み込めませんでした。');
      render(data);
    } catch (e) {
      showError('通信に失敗しました。電波の良い場所で開き直してください。');
    }
  }

  $('useBtn').addEventListener('click', () => {
    if (!current || current.state !== 'available') return;
    $('confirmText').textContent = `「${current.coupon.name}」を使用済みにします。元に戻せません。お客様のLINE画面であることを確認してから押してください。`;
    $('confirm').hidden = false;
    $('okBtn').focus();
  });
  $('cancelBtn').addEventListener('click', () => { $('confirm').hidden = true; });

  $('okBtn').addEventListener('click', async () => {
    const ok = $('okBtn');
    ok.disabled = true;
    ok.textContent = '送信中…';
    try {
      const data = await callGas({ action: 'redeem', coupon, idToken });
      $('confirm').hidden = true;
      if (data.state) render(data);           // 使用済み・期限切れ等、最新の状態を表示
      else showError(data.message || '消し込みに失敗しました。もう一度お試しください。');
    } catch (e) {
      $('confirm').hidden = true;
      // 通信エラー時は状態を取り直す（サーバー側で記録済みの可能性があるため）
      await load();
    } finally {
      ok.disabled = false;
      ok.textContent = '使用済みにする';
    }
  });

  (async function main() {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }

      coupon = new URLSearchParams(location.search).get('coupon') || '';
      if (!coupon) return showError('クーポンの種類がわかりません。LINEのメッセージから開き直してください。');

      idToken = liff.getIDToken();
      if (!idToken) return showError('ログイン情報を取得できませんでした。LIFFのScopeに openid を追加してください。');

      await load();
    } catch (e) {
      showError('起動に失敗しました。LINEアプリから開き直してください。');
    }
  })();
</script>
</body>
</html>
